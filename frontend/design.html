<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Дизайн — СТРОЙ AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#050505',
                        'dark-card': '#0A0A0A',
                        'dark-surface': '#111111',
                        'beige': '#D4B896',
                        'gold-premium': '#C8A87C',
                        'ivory': '#F5F0E6',
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Manrope', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-ivory font-sans">

    <header class="fixed w-full z-50 bg-black/70 backdrop-blur-xl border-b border-beige/20">
        <div class="container mx-auto px-8 py-5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <svg class="w-8 h-8" viewBox="0 0 100 100">
                    <rect x="25" y="25" width="20" height="20" fill="#D4B896" opacity="0.9"/>
                    <rect x="55" y="25" width="20" height="20" fill="#D4B896" opacity="0.5"/>
                    <rect x="25" y="55" width="20" height="20" fill="#D4B896" opacity="0.5"/>
                    <rect x="55" y="55" width="20" height="20" fill="#D4B896" opacity="0.9"/>
                </svg>
                <span class="text-xl font-serif font-bold"><span class="text-beige">СТРОЙ</span><span class="text-ivory">AI</span></span>
            </a>
            <nav class="hidden md:flex gap-10 text-sm font-medium uppercase tracking-wide">
                <a href="design.html" class="text-beige border-b border-beige pb-1">Дизайн</a>
                <a href="index.html#services">Материалы</a>
                <a href="calculator.html">Калькулятор</a>
                <a href="index.html#contacts">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="pt-36 pb-24">
        <div class="container mx-auto px-8 max-w-4xl">
            <div class="text-center mb-16">
                <div class="inline-block w-12 h-px bg-beige mb-4"></div>
                <span class="text-beige text-sm tracking-[0.2em] uppercase font-semibold">НЕЙРОСЕТЬ HARMONY</span>
                <h1 class="text-5xl md:text-6xl font-serif font-bold mt-3">ГЕНЕРАТОР <span class="text-beige">ИНТЕРЬЕРА</span></h1>
                <p class="text-ivory/50 mt-4 text-lg">Опишите ваше пространство — AI создаст эксклюзивный дизайн за 60 секунд</p>
            </div>

            <div class="bg-dark-surface border border-beige/10 rounded-none p-8 shadow-2xl">
                <!-- Поле для описания -->
                <textarea id="roomDescription" rows="5" class="w-full bg-dark-bg border border-beige/20 rounded-none p-5 text-ivory focus:border-beige focus:outline-none resize-none placeholder:text-ivory/30 mb-6" placeholder="Пример: Modern living room, beige tones, large windows, minimalist style, wooden floor, cozy atmosphere"></textarea>
                
                <button id="generateBtn" class="w-full bg-gradient-to-r from-beige to-gold-premium text-dark-bg font-semibold py-4 tracking-wider hover:shadow-xl transition-all transform hover:scale-[1.01] flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    СГЕНЕРИРОВАТЬ ДИЗАЙН
                </button>

                <!-- Спиннер загрузки -->
                <div id="loadingSpinner" class="hidden flex justify-center py-16">
                    <div class="relative">
                        <div class="w-16 h-16 border-2 border-beige/30 border-t-beige rounded-full animate-spin"></div>
                        <div class="absolute inset-0 flex items-center justify-center text-xs text-beige tracking-wider">AI</div>
                    </div>
                </div>

                <!-- Результат генерации -->
                <div id="designResult" class="hidden mt-10">
                    <div class="relative group overflow-hidden rounded-lg">
                        <img id="designImage" src="" alt="Сгенерированный дизайн" class="w-full transition-all duration-700">
                        <div class="absolute bottom-4 right-4 bg-black/60 backdrop-blur-sm px-4 py-1 text-xs text-beige tracking-wider rounded">AI GENERATED · 8K</div>
                    </div>
                </div>

                <!-- Кнопка для заказа -->
                <div id="orderSection" class="hidden mt-8 text-center">
                    <button id="orderBtn" class="border-2 border-beige text-beige px-10 py-3 font-semibold tracking-wider hover:bg-beige/10 transition-all">
                        ЗАКАЗАТЬ ПРОЕКТ →
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark-card border-t border-beige/10 py-8 text-center text-ivory/30 text-sm tracking-wide">
        СТРОЙ AI — НЕЙРОСЕТЕВЫЕ ТЕХНОЛОГИИ В ПРЕМИУМ-СТРОИТЕЛЬСТВЕ
    </footer>

    <script>
        // API endpoint бэкенда
        const API_URL = 'http://localhost:5000/api/generate-design';
        
        const generateBtn = document.getElementById('generateBtn');
        const roomDescription = document.getElementById('roomDescription');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const designResult = document.getElementById('designResult');
        const designImage = document.getElementById('designImage');
        const orderSection = document.getElementById('orderSection');
        
        generateBtn.addEventListener('click', async () => {
            const description = roomDescription.value.trim();
            
            if (!description) {
                alert('Пожалуйста, опишите желаемый дизайн на английском языке');
                return;
            }
            
            // Показываем спиннер, скрываем старые результаты
            loadingSpinner.classList.remove('hidden');
            designResult.classList.add('hidden');
            orderSection.classList.add('hidden');
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ ГЕНЕРАЦИЯ...';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ description: description })
                });
                
                const data = await response.json();
                
                if (data.success && data.image) {
                    designImage.src = `data:image/jpeg;base64,${data.image}`;
                    designResult.classList.remove('hidden');
                    orderSection.classList.remove('hidden');
                } else {
                    alert('Ошибка генерации: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Не удалось соединиться с сервером. Убедитесь, что бэкенд запущен (node server.js)');
            } finally {
                loadingSpinner.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.textContent = 'СГЕНЕРИРОВАТЬ ДИЗАЙН';
            }
        });
        
        // Кнопка заказа (можно настроить под вашу CRM)
        const orderBtn = document.getElementById('orderBtn');
        orderBtn.addEventListener('click', () => {
            alert('Спасибо! Менеджер свяжется с вами для уточнения деталей.');
            // Здесь можно добавить отправку заявки в Битрикс24
        });
    </script>
</body>
</html>
