<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор — СТРОЙ AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#050505',
                        'dark-card': '#0A0A0A',
                        'dark-surface': '#111111',
                        'beige': '#D4B896',
                        'gold-premium': '#C8A87C',
                        'ivory': '#F5F0E6',
                    },
                    fontFamily: {
                        'serif': ['Playfair Display', 'serif'],
                        'sans': ['Manrope', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-ivory font-sans">

    <header class="fixed w-full z-50 bg-black/70 backdrop-blur-xl border-b border-beige/20">
        <div class="container mx-auto px-8 py-5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <svg class="w-8 h-8" viewBox="0 0 100 100">
                    <rect x="25" y="25" width="20" height="20" fill="#D4B896" opacity="0.9"/>
                    <rect x="55" y="25" width="20" height="20" fill="#D4B896" opacity="0.5"/>
                    <rect x="25" y="55" width="20" height="20" fill="#D4B896" opacity="0.5"/>
                    <rect x="55" y="55" width="20" height="20" fill="#D4B896" opacity="0.9"/>
                </svg>
                <span class="text-xl font-serif font-bold"><span class="text-beige">СТРОЙ</span><span class="text-ivory">AI</span></span>
            </a>
            <nav class="hidden md:flex gap-10 text-sm font-medium uppercase tracking-wide">
                <a href="design.html">Дизайн</a>
                <a href="index.html#services">Материалы</a>
                <a href="calculator.html" class="text-beige border-b border-beige pb-1">Калькулятор</a>
                <a href="index.html#contacts">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="pt-36 pb-24">
        <div class="container mx-auto px-8 max-w-2xl">
            <div class="text-center mb-12">
                <div class="inline-block w-12 h-px bg-beige mb-4"></div>
                <span class="text-beige text-sm tracking-[0.2em] uppercase font-semibold">SMART PRICING</span>
                <h1 class="text-5xl font-serif font-bold mt-3">РАСЧЁТ <span class="text-beige">СТОИМОСТИ</span></h1>
                <p class="text-ivory/50 mt-3">Нейросеть анализирует рынок и выдаёт точную смету</p>
            </div>

            <div class="bg-dark-surface border border-beige/10 p-8 shadow-2xl">
                <!-- Тип помещения -->
                <div class="mb-8">
                    <label class="block font-serif font-semibold mb-3 text-beige text-sm tracking-wide">ТИП ОБЪЕКТА</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" data-room="apartment" class="room-type-btn py-3 bg-dark-bg border border-beige/20 hover:border-beige transition-all">КВАРТИРА</button>
                        <button type="button" data-room="house" class="room-type-btn py-3 bg-dark-bg border border-beige/20 hover:border-beige transition-all">ДОМ</button>
                        <button type="button" data-room="office" class="room-type-btn py-3 bg-dark-bg border border-beige/20 hover:border-beige transition-all">ОФИС</button>
                    </div>
                    <input type="hidden" id="roomType" value="apartment">
                </div>

                <!-- Площадь -->
                <div class="mb-8">
                    <label class="block font-serif font-semibold mb-3 text-beige text-sm tracking-wide">ПЛОЩАДЬ: <span id="areaValue" class="text-ivory text-2xl">45</span> м²</label>
                    <input type="range" id="areaSlider" min="20" max="200" value="45" class="w-full h-px bg-beige/30 rounded-lg appearance-none cursor-pointer">
                    <div class="flex justify-between text-xs text-ivory/30 mt-2"><span>20 м²</span><span>100 м²</span><span>200 м²</span></div>
                </div>

                <!-- Тип ремонта -->
                <div class="mb-8">
                    <label class="block font-serif font-semibold mb-3 text-beige text-sm tracking-wide">КЛАСС РЕМОНТА</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" data-repair="cosmetic" class="repair-type-btn py-3 bg-dark-bg border border-beige/20 hover:border-beige transition-all">КОСМЕТИЧЕСКИЙ</button>
                        <button type="button" data-repair="capital" class="repair-type-btn py-3 bg-dark-bg border border-beige/20 hover:border-beige transition-all">КАПИТАЛЬНЫЙ</button>
                        <button type="button" data-repair="designer" class="repair-type-btn py-3 bg-dark-bg border border-beige/20 hover:border-beige transition-all active-repair">ПРЕМИУМ</button>
                    </div>
                    <input type="hidden" id="repairType" value="designer">
                </div>

                <!-- Результат с детальной разбивкой -->
                <div class="bg-gradient-to-r from-beige/5 to-transparent border-l-4 border-beige p-6 my-8">
                    <p class="text-ivory/40 text-sm tracking-wide">ПРЕДВАРИТЕЛЬНАЯ СМЕТА</p>
                    <p class="text-4xl md:text-5xl font-serif font-bold text-beige" id="priceResult">0 ₽</p>
                    
                    <!-- Детали расчёта -->
                    <div class="mt-4 pt-4 border-t border-beige/20 text-sm">
                        <div class="flex justify-between py-1">
                            <span class="text-ivory/50">Стоимость за м²:</span>
                            <span class="text-beige" id="pricePerM2">0 ₽</span>
                        </div>
                        <div class="flex justify-between py-1">
                            <span class="text-ivory/50">Коэффициент сложности:</span>
                            <span class="text-beige" id="complexityMultiplier">1.0x</span>
                        </div>
                        <div class="flex justify-between py-1">
                            <span class="text-ivory/50">Примерный срок ремонта:</span>
                            <span class="text-beige" id="durationEstimate">—</span>
                        </div>
                    </div>
                </div>

                <button id="exactCalcBtn" class="w-full bg-gradient-to-r from-beige to-gold-premium text-dark-bg font-semibold py-4 tracking-wider hover:shadow-xl transition-all flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    ПЕРЕЙТИ К ДИЗАЙНУ
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-dark-card border-t border-beige/10 py-8 text-center text-ivory/30 text-sm tracking-wide">
        ТОЧНОСТЬ РАСЧЁТА ±2% — ГАРАНТИЯ НЕЙРОСЕТИ
    </footer>
    <script src="script.js"></script>
</body>
</html>
